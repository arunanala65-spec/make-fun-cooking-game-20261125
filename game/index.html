<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dapur Kilat — Warung Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241610; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<noscript><p style="color:#fff6e3;font-family:sans-serif;padding:2rem">Dapur Kilat butuh JavaScript untuk dimainkan.</p></noscript>
<canvas id="game" aria-label="Dapur Kilat: game memasak warung — rakit pesanan dari bahan di meja, masak di wajan, sajikan sebelum pelanggan kehabisan sabar"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
